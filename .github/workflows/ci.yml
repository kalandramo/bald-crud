# ci：全模块 build + vet + test（模块自动发现）。
# 说明：
# - 多模块仓库（根 + 13 子模块），无 matrix 预发现 job——shell 循环即可，
#   模块增删零维护。
# - go 版本写死与各 go.mod 对齐（go-version-file 仅适用单模块仓库）。
# - 集成测试约定：无外部服务时自动 skip（testing.Short() / 服务的
#   不可达探测，见各引擎 client_test.go），CI 无服务容器也能全量跑；
#   引擎真连验证属发布前手工步骤。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: build + vet + test all modules
        run: |
          set -e
          for mod in $(find . -name go.mod -not -path "./.git/*" | xargs -n1 dirname | sort); do
            echo "=== $mod ==="
            (cd "$mod" && go build ./... && go vet ./... && go test ./...)
          done
